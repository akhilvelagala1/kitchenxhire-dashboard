<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Recruiter working on a laptop">
  <defs>
    <clipPath id="recruiter-circle">
      <circle cx="200" cy="200" r="196" />
    </clipPath>
  </defs>

  <circle cx="200" cy="200" r="196" fill="#FBE3D5" />

  <g clip-path="url(#recruiter-circle)">
    <!-- shoulders and jacket -->
    <path d="M100 400c0-84 22-132 58-152h84c36 20 58 68 58 152z" fill="#2C3A63" />

    <!-- shirt -->
    <path d="M200 246l-30 24 30 102 30-102z" fill="#FFFFFF" />
    <path d="M200 292l-17 80h34z" fill="#F1F4FA" />

    <!-- lapels -->
    <path d="M170 270l30-24 5 118-33-12z" fill="#232F52" />
    <path d="M230 270l-30-24-5 118 33-12z" fill="#232F52" />

    <!-- neck -->
    <path d="M180 196h40v30c0 12-9 20-20 20s-20-8-20-20z" fill="#E9AE85" />

    <!-- head -->
    <ellipse cx="200" cy="146" rx="44" ry="50" fill="#F2C29C" />
    <circle cx="157" cy="150" r="8" fill="#EFB48F" />
    <circle cx="243" cy="150" r="8" fill="#EFB48F" />

    <!-- hair -->
    <path
      d="M156 150c-8-54 12-78 44-78s52 24 45 78c-5-24-17-36-36-40-22-4-40 6-48 26-1 5-3 9-5 14z"
      fill="#202838"
    />

    <!-- face -->
    <path d="M175 135c7-5 14-5 20 0" stroke="#202838" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M205 135c6-5 13-5 20 0" stroke="#202838" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="184" cy="150" r="3.4" fill="#202838" />
    <circle cx="216" cy="150" r="3.4" fill="#202838" />
    <path d="M186 166q14 12 28 0" stroke="#8C4A32" stroke-width="3.4" stroke-linecap="round" fill="none" />

    <!-- sleeves -->
    <path d="M116 286c-8 34-12 72-12 114h40l14-96z" fill="#26325A" />
    <path d="M284 286c8 34 12 72 12 114h-40l-14-96z" fill="#26325A" />

    <!-- laptop -->
    <rect x="124" y="284" width="152" height="84" rx="10" fill="#55627F" />
    <rect x="132" y="292" width="136" height="68" rx="7" fill="#6B7794" />
    <path d="M110 368h180l12 18H98z" fill="#3D4861" />
    <path d="M110 368h180l3 5H107z" fill="#97A2BC" />

    <!-- speech bubble -->
    <path d="M286 132c-3 13-10 20-21 23 12 2 22-4 28-14z" fill="#FFFFFF" />
    <rect x="250" y="46" width="100" height="88" rx="22" fill="#FFFFFF" />
    <circle cx="300" cy="90" r="26" fill="#FFD9C6" />
    <circle cx="290" cy="84" r="5" fill="#FFFFFF" />
    <circle cx="308" cy="84" r="5" fill="#FFFFFF" />
    <circle cx="299" cy="97" r="4" fill="#FFFFFF" />
    <path d="M281 98c0-5 4-8 9-8s9 3 9 8z" fill="#FFFFFF" />
    <path d="M300 98c0-5 4-8 9-8s9 3 9 8z" fill="#FFFFFF" />
